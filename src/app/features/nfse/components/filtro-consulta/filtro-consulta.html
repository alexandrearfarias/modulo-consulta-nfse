<form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="filtros">
        <mat-form-field appearance="outline">
            <mat-label>Data Inicial</mat-label>
            <input matInput type="date" formControlName="dataInicial">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Data Final</mat-label>
            <input matInput type="date" formControlName="dataFinal">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>CPF/CNPJ</mat-label>
            <input matInput type="text" formControlName="documento" maxlength="14">
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Número da NFSe</mat-label>
            <input matInput type="text" formControlName="numeroNfse">
        </mat-form-field>

        <div class="acoes">
            <button matButton="filled" type="submit">Consultar</button>
        </div>
    </div>
</form>
